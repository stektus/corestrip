name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import json;print(json.load(open('package/metadata.json'))['KPlugin']['Version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "metadata.json says $version but the tag says $tag" >&2
            exit 1
          fi

      - name: Build the .plasmoid bundle
        run: ./package.sh

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.plasmoid \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
