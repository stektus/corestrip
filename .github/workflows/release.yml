name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build every .plasmoid bundle
        run: ./package.sh

      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.plasmoid \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
